<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Ehsan ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <style>
        body { background-color: #ffeef2; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; overflow-x: hidden; }
        .container { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 85%; max-width: 450px; z-index: 10; position: relative; }
        h1 { color: #d63384; font-size: 24px; margin-bottom: 20px; }
        .cake { font-size: 60px; animation: float 2.5s infinite; display: inline-block; margin-bottom: 10px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        /* Typing Area Styling */
        #message-area { 
            font-size: 18px; 
            color: #444; 
            margin: 20px 0; 
            line-height: 1.8; 
            text-align: left; 
            min-height: 200px; 
            white-space: pre-wrap; 
            font-weight: 500;
            border-left: 3px solid #ff4d6d;
            padding-left: 15px;
        }

        .btn { background-color: #ff4d6d; color: white; border: none; padding: 15px 35px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 17px; box-shadow: 0 5px 15px rgba(255,77,109,0.4); transition: 0.3s; }
        .btn:hover { transform: scale(1.05); background-color: #c9184a; }
        .footer { margin-top: 30px; font-size: 12px; color: #aaa; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="bdaySong" preload="auto" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="cake">🎂</div>
        <h1>Happy Birthday, Ehsan! ❤️</h1>
        
        <div id="message-area">Ayesha has a special message for you... Click below! ✨</div>
        
        <button id="main-btn" class="btn" onclick="startSurprise()">Read My Heart ❤️</button>

        <div class="footer">
            CREATED WITH LOVE BY AYESHA ✨<br>
            ♡ ALWAYS & FOREVER ♡
        </div>
    </div>

    <script>
        const textToType = `Happy Birthday to the person who owns my heart! ✨💗🎂\n\nI hope your day is as beautiful as your smile and as bright as your soul.🫂✨️\n\nAp meri life ki sab se haseen haqeeqat hain, aur ap k saath guzra har pal mere liye kisi tohfay se kam nahi.🥹🫠\n\nMay Allah bless you with endless happiness, health, and success. Meri dua hai ke ap hamesha muskuraate raho, kyunki apki khushi mein hi meri duniya hai.😘😍\n\nCheers to another year of us, growing together and loving more. Hamesha khush raho, my love! 🎂❤️🌹\n\n"Happy Birthday, Love! ✨\nAllah apko woh sab kuch de jo apka dil chahta hai. You deserve the world and so much more. Stay blessed!"😌💋\n\n"HBD to my favorite human! 🌝🎀\nAp k saath zindagi bohot khubsurat hai. May this year bring you as much joy as you’ve given me.🫠❣️\n\n"Happy Birthday to the one who makes every moment feel like a celebration. You are my greatest blessing and my favorite "sukoon."💖🥺🫂\n\nStay with me meri jawn !! 💗\nLove you so much Ehsan !! 💋🫂`;

        let i = 0;
        const typingSpeed = 60; // 1 alphabet every 60ms

        function typeEffect() {
            if (i < textToType.length) {
                document.getElementById("message-area").innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeEffect, typingSpeed);
                // Page automatically scrolls down as it types
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                showHearts();
            }
        }

        function showHearts() {
            const end = Date.now() + (10 * 1000); // Hearts for 10 seconds
            (function frame() {
                confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, shapes: ['heart'], colors: ['#ff4d6d', '#ff758f'] });
                confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, shapes: ['heart'], colors: ['#ff4d6d', '#ff758f'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function startSurprise() {
            // 1. Start Music
            const audio = document.getElementById("bdaySong");
            audio.play().catch(error => console.log("Music play blocked by browser settings"));

            // 2. Hide Button
            document.getElementById("main-btn").style.display = "none";

            // 3. Clear placeholder and start typing
            document.getElementById("message-area").innerHTML = "";
            typeEffect();
        }
    </script>
</body>
</html>
