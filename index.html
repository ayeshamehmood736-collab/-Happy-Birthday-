<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Ehsan ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <style>
        body { 
            background-image: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            text-align: center; 
            overflow-x: hidden; 
        }
        .container { 
            background: rgba(255, 255, 255, 0.88); 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            width: 85%; 
            max-width: 450px; 
            z-index: 10; 
            backdrop-filter: blur(8px);
        }
        h1 { color: #d63384; font-size: 24px; margin-bottom: 15px; }
        .cake-icon { font-size: 55px; animation: float 2.5s infinite; display: inline-block; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        #message-area { 
            font-size: 17px; 
            color: #333; 
            margin: 20px 0; 
            line-height: 1.8; 
            text-align: left; 
            min-height: 250px; 
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap; 
            font-weight: 500;
            background-color: #fff0f3; 
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #ff4d6d; 
            box-shadow: inset 0 2px 10px rgba(255,77,109,0.1);
        }
        
        .btn { background-color: #ff4d6d; color: white; border: none; padding: 15px 35px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 17px; box-shadow: 0 4px 10px rgba(255,77,109,0.3); }
        .footer { margin-top: 25px; font-size: 11px; color: #777; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="birthdayMusic1">
        <source src="https://files.catbox.moe/w8igxu.mp3" type="audio/mpeg">
    </audio>
    <audio id="birthdayMusic2">
        <source src="https://files.catbox.moe/dza4pt.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="cake-icon">🎂</div>
        <h1>Happy Birthday, Ehsan! ❤️</h1>
        <div id="message-area">Click below to feel my heartbeat... ✨</div>
        <button id="main-btn" class="btn" onclick="startExperience()">Read My Heart ❤️</button>
        <div class="footer">CREATED WITH UNLIMITED LOVE BY AYESHA ✨<br>♡ ALWAYS & FOREVER ♡</div>
    </div>

    <script>
        const fullText = `Happy Birthday to the person who owns my heart! ✨💗🎂\n\nI hope your day is as beautiful as your smile and as bright as your soul.🫂✨️\n\nAp meri life ki sab se haseen haqeeqat hain, aur ap k saath guzra har pal mere liye kisi tohfay se kam nahi.🥹🫠\n\nMay Allah bless you with endless happiness, health, and success. Meri dua hai ke ap hamesha muskuraate raho, kyunki apki khushi mein hi meri duniya hai.😘😍\n\nCheers to another year of us, growing together and loving more. Hamesha khush raho, my love! 🎂❤️🌹\n\n"Happy Birthday, Love! ✨\nAllah apko woh sab kuch de jo apka dil chahta hai. You deserve the world and so much more. Stay blessed!"😌💋\n\n"HBD to my favorite human! 🌝🎀\nAp k saath zindagi bohot khubsurat hai. May this year bring you as much joy as you’ve given me.🫠❣️\n\n"Happy Birthday to the one who makes every moment feel like a celebration. You are my greatest blessing and my favorite "sukoon."💖🥺🫂\n\n--- Special Note ---\n\nHar saal, har din, har pal... mera pyar apke liye barhta hi jayega. Ap sirf meri pasand nahi, meri zaroorat ho. ❤️\n\nI promise to stand by you in every storm and every sunshine. Meri puri kainaat ap hi ho! 🌍💍\n\nStay with me meri jawn !! 💗\nLove you so much Ehsan !! 💋🫂\n\nYours Forever, Ayesha ✨`;

        let charIndex = 0;
        const typingSpeed = 95; 
        let isTyping = true;

        const music1 = document.getElementById('birthdayMusic1');
        const music2 = document.getElementById('birthdayMusic2');

        // Music Playlist Transition
        music1.onended = function() {
            music2.play();
        };

        function typeWriter() {
            if (charIndex < fullText.length) {
                document.getElementById('message-area').innerHTML += fullText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
                
                const area = document.getElementById('message-area');
                area.scrollTop = area.scrollHeight;
            } else {
                isTyping = false; // Typing khatam ho gayi
            }
        }

        function showHeartsAndCakes() {
            if (!isTyping) return; // Agar typing ruk jaye toh girna band ho jaye

            confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, shapes: ['heart'], colors: ['#ff4d6d', '#ff758f'] });
            confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, shapes: ['heart'], colors: ['#c9184a'] });

            if(Math.random() > 0.94) {
                confetti({ particleCount: 1, spread: 360, origin: { y: Math.random() - 0.2 }, shapes: ['text'], shapeOptions: { text: { value: ['🎂'] } }, scalar: 2 });
            }
            requestAnimationFrame(showHeartsAndCakes);
        }

        function startExperience() {
            music1.play();
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('message-area').innerHTML = "";
            
            typeWriter();
            showHeartsAndCakes();
        }
    </script>
</body>
</html>
