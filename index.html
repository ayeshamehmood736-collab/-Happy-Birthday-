<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Ehsan ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <style>
        body { background-color: #ffeef2; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; text-align: center; overflow-x: hidden; }
        .container { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 85%; max-width: 450px; z-index: 10; }
        h1 { color: #d63384; font-size: 24px; }
        .cake { font-size: 60px; animation: float 2.5s infinite; display: inline-block; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        #message-area { font-size: 17px; color: #555; margin: 20px 0; line-height: 1.6; text-align: left; min-height: 100px; white-space: pre-wrap; }
        .btn { background-color: #ff4d6d; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .footer { margin-top: 30px; font-size: 11px; color: #aaa; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="cake">🎂</div>
        <h1>Happy Birthday, Ehsan! ❤️</h1>
        <div id="message-area">Click the button to read your message...</div>
        <button id="main-btn" class="btn" onclick="startExperience()">Read My Heart ❤️</button>
        <div class="footer">CREATED WITH LOVE BY AYESHA ✨<br>♡ ALWAYS & FOREVER ♡</div>
    </div>
    <script>
        const msg = [
            "Happy Birthday to the person who owns my heart! ✨💗🎂",
            "I hope your day is as beautiful as your smile and as bright as your soul.🫂✨️",
            "Ap meri life ki sab se haseen haqeeqat hain, aur ap k saath guzra har pal mere liye kisi tohfay se kam nahi.🥹🫠",
            "May Allah bless you with endless happiness, health, and success. Meri dua hai ke ap hamesha muskuraate raho, kyunki apki khushi mein hi meri duniya hai.😘😍",
            "Cheers to another year of us, growing together and loving more. Hamesha khush raho, my love! 🎂❤️🌹",
            "Happy Birthday, Love! ✨ Allah apko woh sab kuch de jo apka dil chahta hai. You deserve the world and so much more. Stay blessed!😌💋",
            "HBD to my favorite human! 🌝🎀",
            "Ap k saath zindagi bohot khubsurat hai. May this year bring you as much joy as you’ve given me.🫠❣️",
            "Happy Birthday to the one who makes every moment feel like a celebration. You are my greatest blessing and my favorite 'sukoon.'💖🥺🫂",
            "Stay with me meri jawn !! 💗",
            "Love you so much Ehsan !! 💋🫂"
        ];

        let idx = 0;
        function typeWriter() {
            if (idx < msg.length) {
                if(idx === 0) document.getElementById('message-area').innerHTML = "";
                document.getElementById('message-area').innerHTML += msg[idx] + "<br><br>";
                idx++;
                setTimeout(typeWriter, 1500); 
            } else {
                startHearts();
            }
        }

        function startHearts() {
            const end = Date.now() + (15 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, shapes: ['heart'], colors: ['#ff4d6d'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, shapes: ['heart'], colors: ['#ff4d6d'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function startExperience() {
            document.getElementById('main-btn').style.display = 'none';
            typeWriter();
        }
    </script>
</body>
</html>
