<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Ehsan ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <style>
        body { background-color: #ffeef2; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; text-align: center; overflow-x: hidden; }
        .container { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 85%; max-width: 450px; z-index: 10; }
        h1 { color: #d63384; font-size: 24px; }
        .cake { font-size: 60px; animation: float 2.5s infinite; display: inline-block; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        #message-area { font-size: 17px; color: #555; margin: 20px 0; line-height: 1.6; text-align: left; min-height: 150px; white-space: pre-wrap; font-weight: 500; }
        .btn { background-color: #ff4d6d; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(255,77,109,0.3); }
        .footer { margin-top: 30px; font-size: 11px; color: #aaa; }
    </style>
</head>
<body>

    <audio id="birthdayMusic" loop>
        <source src="https://www.mboxdrive.com/Happy%20Birthday%20Instrumental.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="cake">🎂</div>
        <h1>Happy Birthday, Ehsan! ❤️</h1>
        <div id="message-area">Click the button to read your message...</div>
        <button id="main-btn" class="btn" onclick="startExperience()">Read My Heart ❤️</button>
        <div class="footer">CREATED WITH LOVE BY AYESHA ✨<br>♡ ALWAYS & FOREVER ♡</div>
    </div>

    <script>
        const fullText = `Happy Birthday to the person who owns my heart! ✨💗🎂\n\nI hope your day is as beautiful as your smile and as bright as your soul.🫂✨️\n\nAp meri life ki sab se haseen haqeeqat hain, aur ap k saath guzra har pal mere liye kisi tohfay se kam nahi.🥹🫠\n\nMay Allah bless you with endless happiness, health, and success. Meri dua hai ke ap hamesha muskuraate raho, kyunki apki khushi mein hi meri duniya hai.😘😍\n\nCheers to another year of us, growing together and loving more. Hamesha khush raho, my love! 🎂❤️🌹\n\n"Happy Birthday, Love! ✨\nAllah apko woh sab kuch de jo apka dil chahta hai. You deserve the world and so much more. Stay blessed!"😌💋\n\n"HBD to my favorite human! 🌝🎀\nAp k saath zindagi bohot khubsurat hai. May this year bring you as much joy as you’ve given me.🫠❣️\n\n"Happy Birthday to the one who makes every moment feel like a celebration. You are my greatest blessing and my favorite "sukoon."💖🥺🫂\n\nStay with me meri jawn !! 💗\nLove you so much Ehsan !! 💋🫂`;

        let charIndex = 0;
        const speed = 50; // Speed in milliseconds (ek alphabet kitni dair mein aaye)

        function typeWriter() {
            if (charIndex < fullText.length) {
                document.getElementById('message-area').innerHTML += fullText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, speed);
                // Auto scroll to bottom as text types
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                startHearts();
            }
        }

        function startHearts() {
            const end = Date.now() + (15 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, shapes: ['heart'], colors: ['#ff4d6d'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, shapes: ['heart'], colors: ['#ff4d6d'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function startExperience() {
            // Play Music
            const music = document.getElementById('birthdayMusic');
            music.play().catch(e => console.log("Music play failed:", e));

            // Hide Button
            document.getElementById('main-btn').style.display = 'none';
            
            // Clear placeholder
            document.getElementById('message-area').innerHTML = "";
            
            // Start Typing
            typeWriter();
        }
    </script>
</body>
</html>
